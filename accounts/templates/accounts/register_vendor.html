{% extends 'base.html' %}

{% block content %}

<div style="display:flex; justify-content:center; padding:2.5rem 1rem;">
<div style="width:100%; max-width:440px; background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:12px; padding:2rem;">

    <div style="margin-bottom:1.75rem;">
        <h1 style="font-size:18px; font-weight:500;">Become a vendor</h1>
        <p style="font-size:13px; color:#999; margin-top:4px;">Set up your shop on Ice Cream Shop</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <p style="font-size:11px; color:#bbb; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:1rem;">Account details</p>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Username</label>
            <input type="text" name="username" required placeholder="e.g. frosty_bites"
                   style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%;">
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Email</label>
            <input type="email" name="email" required placeholder="you@example.com"
                   style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%;">
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%;">
        </div>

        <div style="height:1px; background:rgba(0,0,0,.07); margin:1.5rem 0;"></div>
        <p style="font-size:11px; color:#bbb; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:1rem;">Shop details</p>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Shop name</label>
            <input type="text" name="shop_name" required placeholder="e.g. Frosty Bites"
                   style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%;">
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Address</label>
            <textarea name="address" rows="3" required placeholder="123 MG Road, Bengaluru…"
                      style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%; resize:none; font-family:inherit;"></textarea>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
            <label style="font-size:12px; color:#666;">Phone number</label>
            <input type="text" name="phone" required placeholder="+91 98765 43210"
                   style="background:#f9f9f7; border:1px solid rgba(0,0,0,.12); border-radius:7px; padding:9px 12px; font-size:14px; color:#1a1a1a; outline:none; width:100%;">
        </div>

        <div style="display:flex; gap:8px; margin-top:1.5rem;">
            <button type="submit"
                    style="flex:1; font-size:13px; padding:9px 20px; border-radius:7px; border:none; background:#1a1a1a; color:#fff; font-weight:500; cursor:pointer;">
                Register vendor
            </button>
            <a href="{% url 'login' %}"
               style="font-size:13px; padding:9px 20px; border-radius:7px; border:1px solid rgba(0,0,0,.12); background:transparent; color:#666; text-decoration:none; white-space:nowrap;">
                Login instead
            </a>
        </div>

    </form>
</div>
</div>

{% endblock %}
