{% extends 'base.html' %}

{% block content %}

<h2>{{ product.name }}</h2>

{% if product.image %}
    <img src="{{ product.image.url }}" width="300">
{% endif %}

<p>{{ product.description }}</p>

<p>Price: ₹{{ product.price }}</p>

<p>Stock: {{ product.stock }}</p>

<a href="/">Back to Products</a>

{% endblock %}
